<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="canvas"></div>

    <script type="importmap">
  {
"imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
}
  }
</script>
    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const materials = [
            new THREE.MeshBasicMaterial({ color: 0xff6400 }), // Orange
            new THREE.MeshBasicMaterial({ color: 0xff0000 }), // Red
            new THREE.MeshBasicMaterial({ color: 0x0000bb }), // Blue
            new THREE.MeshBasicMaterial({ color: 0x00bb00 }), // Green
            new THREE.MeshBasicMaterial({ color: 0xffff00 }), // Yellow
            new THREE.MeshBasicMaterial({ color: 0xffffff })  // White
        ];

        const material = Array(6).fill(
            new THREE.MeshBasicMaterial({ color: 0x808080 })
        );
        const cube = new THREE.Mesh(geometry, material);
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }),);
        var controls = new OrbitControls(camera, renderer.domElement);

        var group = new THREE.Group();
        var pivot = new THREE.Group();
        for (let x = 0; x < 3; x++) {
            for (let y = 0; y < 3; y++) {
                for (let z = 0; z < 3; z++) {
                    const newCube = cube.clone();
                    newCube.position.set(
                        x * 3 - 3,
                        y * 3 - 3,
                        z * 3 - 3
                    );
                    [
                        [x === 2, 0],
                        [x === 0, 1],
                        [y === 2, 2],
                        [y === 0, 3],
                        [z === 2, 4],
                        [z === 0, 5]
                    ].forEach(([condition, index]) => {
                        if (condition) {
                            newCube.material[index] = materials[index];
                        }
                    });
                    scene.add(newCube);

                    if (x == 2) {
                        console.log("new cube added", newCube);
                        group.add(newCube);
                    }
                    group.add(newCube);
                    pivot.add(newCube);
                    console.log(pivot, "pivot", group, "group")

                    const newLine = line.clone();
                    newLine.position.set(
                        x * 3 - 3,
                        y * 3 - 3,
                        z * 3 - 3
                    );
                    scene.add(newLine);
                }
            }
        }
        scene.add(pivot);
        scene.add(group);
        console.log("group", group)
        // pivot.rotation.x = 1
        var box = new THREE.Box3().setFromObject(cube);
        box.getCenter(cube.position);
        // this re-sets the mesh position
        cube.position.multiplyScalar(- 1);




        // var box = new THREE.Box3().setFromObject(cube);
        // box.getCenter(cube.position); // this re-sets the mesh position
        // cube.position.multiplyScalar(- 1);

        // var pivot = new THREE.Group();
        // scene.add(pivot);
        // pivot.add(cube);

        camera.position.z = 30;
        camera.position.y = 3;
        camera.position.x = 3;
        var xSpeed = 1; // Adjust the speed of rotation around the x-axis
        var ySpeed = 1; // Adjust the speed of rotation around the y-axis
        var zSpeed = 1; // Adjust the speed of rotation around the z-axis
        function animate(time) {
            // cube.rotation.x = time / ySpeed;
            // cube.rotation.y = time / xSpeed;
            // cube.rotation.z = time / zSpeed;
            renderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);

        // if (keyboard.isPressed("ArrowUp")) {
        //     cube.position.y += 0.1;
        // }
        document.addEventListener("keydown", onDocumentKeyDown, false);
        function onDocumentKeyDown(event) {
            console.log("Key pressed: " + event.key);
            var keyCode = event.which;
            if (keyCode == 87) {
                console.log("W key pressed");
                cube.position.y += ySpeed;
            } else if (keyCode == 83) {
                console.log("S key pressed");
                cube.position.y -= ySpeed;
            } else if (keyCode == 65) {
                console.log("A key pressed");
                cube.position.x -= xSpeed;
            } else if (keyCode == 68) {
                console.log("D key pressed");
                cube.position.x += xSpeed;
            } else if (keyCode == 32) {
                console.log("Space key pressed");
                cube.position.set(0, 0, 0);
            }
        };


    </script>
</body>

</html>
